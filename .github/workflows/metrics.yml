name: Metrics

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: dige04
          filename: github-metrics.svg
          committer_message: "chore: update metrics [skip actions]"

          # Base sections
          base: header, activity, community, repositories, metadata

          # ISO contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages (most-used via repo languages API — no cloning)
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, scss, jupyter notebook, shell
          plugin_languages_limit: 8
          plugin_languages_aliases: >-
            TypeScript: TS

          # Lines of code changed
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # Achievements
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_limit: 0

          # Notable contributions
          plugin_notable: yes
          plugin_notable_types: commit

          # Starred topics
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

          # Coding habits (events-based, works with GITHUB_TOKEN)
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_habits_days: 14
          plugin_habits_from: 200

          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
